name: PDM sandbox CI
on:
  pull_request:
    branches: [main, pdm-delivery-base-v2]
permissions:
  contents: read
concurrency:
  group: pdm-sandbox-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  tests:
    name: pdm-sandbox-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read exact proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Offline public fixture checks
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s tests -v
